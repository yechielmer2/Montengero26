name: TMB one-time email notification test
on:
  push:
    paths:
      - '.github/workflows/tmb-email-test.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create assigned test issue to trigger GitHub email notification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GH_REPO"]
          url = f"https://api.github.com/repos/{repo}/issues"
          body = {
              "title": "[TMB TEST] Email notification delivery test",
              "body": "This is a one-time test of GitHub issue email notifications. No hut availability was checked. You can close this test issue after verifying the email.",
              "assignees": [repo.split("/")[0]],
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(body).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              issue = json.load(response)
          print("Created notification test issue:", issue["html_url"])
          print("GitHub may send an email if participating notifications are enabled.")
          PY
