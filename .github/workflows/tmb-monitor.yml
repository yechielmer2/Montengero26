name: TMB July 2027 calendar availability monitor
on:
  workflow_dispatch:
  push:
    paths:
      - 'tmb-monitor/monitor.py'
      - '.github/workflows/tmb-monitor.yml'
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: tmb-july-2027-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Check calendar and create assigned issues for new availability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tmb-monitor/monitor.py
