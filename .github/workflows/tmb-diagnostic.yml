name: TMB read-only diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - 'tmb-monitor/diagnose.py'
      - '.github/workflows/tmb-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python tmb-monitor/diagnose.py
